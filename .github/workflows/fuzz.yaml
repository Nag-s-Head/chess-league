name: fuzz

permissions:
  contents: read

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/shared/setup

      - name: Test
        shell: bash
        env:
          FUZZTIME: 5m
          GOFLAGS: "-p=1 -parallel=1"
        run: make fuzz -j
